{{- /* Credentials. The password is applied when the database is first initialised; changing
it later does not change the password inside an existing PostgreSQL volume. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockpilot.secretName" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ .Values.postgres.password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.user (.Values.postgres.password | urlquery | replace "+" "%20") (include "stockpilot.fullname" .) .Values.postgres.database | quote }}
  {{- else }}
  database-url: {{ required "backend.externalDatabaseUrl is required when postgres.enabled=false" .Values.backend.externalDatabaseUrl | quote }}
  {{- end }}
