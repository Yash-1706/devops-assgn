{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stockpilot.fullname" . }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          # /api -> FastAPI backend (more specific, listed first)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockpilot.fullname" . }}-backend
                port:
                  name: http
          # everything else -> React frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stockpilot.fullname" . }}-frontend
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
